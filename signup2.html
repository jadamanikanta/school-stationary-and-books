<body class="login-page signup-page">

                <!-- ========= FORM START ========= -->

                <form id="signupForm">

    <!-- Full Name -->

    <!-- Email -->

    <!-- Mobile -->

    <!-- <div class="form-group">

        <label for="phone">
            Mobile Number

        <div class="input-wrapper">

            <i data-lucide="phone"></i>

            <input
                id="phone"

                required>

    </div> -->

    <!-- Password -->

    <div class="form-group">

        <label for="password">

            <button

    <!-- Terms -->

    <!-- Button -->

        type="submit"
        class="login-btn">

    <!-- Divider -->

            class="social-btn">

            </svg>

            Apple

    </div>

    <div class="signup-row">

        Already have an account?

        <a href="login2.html">

        </a>

</form>

        </div>

    </section>

</div>

</div>

<script>/*=========================================
            LUCIDE ICONS
=========================================*/

lucide.createIcons();

/*=========================================
            HERO SLIDER
=========================================*/

const slides = document.querySelectorAll(".hero-slide");
const dots = document.querySelectorAll(".hero-dot");

let currentSlide = 0;

function showSlide(index){

    slides.forEach(slide => slide.classList.remove("active"));
    dots.forEach(dot => dot.classList.remove("active"));

    slides[index].classList.add("active");
    dots[index].classList.add("active");

}

function nextSlide(){

    currentSlide++;

    if(currentSlide >= slides.length){

        currentSlide = 0;

    }

    showSlide(currentSlide);

}

setInterval(nextSlide,5000);

dots.forEach((dot,index)=>{

    dot.addEventListener("click",()=>{

        currentSlide=index;

        showSlide(index);

    });

});


/*=========================================
            PASSWORD
=========================================*/

const passwordInput=document.getElementById("password");

const passwordBtn=document.getElementById("togglePassword");

let passwordVisible=false;

passwordBtn.addEventListener("click",()=>{

    passwordVisible=!passwordVisible;

    passwordInput.type=passwordVisible ? "text":"password";

    passwordBtn.innerHTML=passwordVisible
    ?'<i data-lucide="eye-off"></i>'
    :'<i data-lucide="eye"></i>';

    lucide.createIcons();

});


/*=========================================
            DARK MODE
=========================================*/

const themeBtn=document.getElementById("themeToggle");

const savedTheme=localStorage.getItem("school-theme");

if(savedTheme==="dark"){

    document.body.classList.add("dark");

}

updateThemeIcon();

themeBtn.addEventListener("click",()=>{

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){

        localStorage.setItem("school-theme","dark");

    }else{

        localStorage.setItem("school-theme","light");

    }

    updateThemeIcon();

});

function updateThemeIcon(){

    if(document.body.classList.contains("dark")){

        themeBtn.innerHTML='<i data-lucide="sun"></i>';

    }else{

        themeBtn.innerHTML='<i data-lucide="moon"></i>';

    }

    lucide.createIcons();

}


/*=========================================
            RTL
=========================================*/

const rtlBtn=document.getElementById("rtlToggle");

const html=document.documentElement;

const savedDir=localStorage.getItem("page-direction");

if(savedDir){

    html.setAttribute("dir",savedDir);

}

rtlBtn.addEventListener("click",()=>{

    if(html.getAttribute("dir")==="rtl"){

        html.setAttribute("dir","ltr");

        localStorage.setItem("page-direction","ltr");

    }else{

        html.setAttribute("dir","rtl");

        localStorage.setItem("page-direction","rtl");

    }

});


/*=========================================
            LOGIN
=========================================*/

const loginForm=document.getElementById("loginForm");

loginForm.addEventListener("submit",(e)=>{

    e.preventDefault();

    const email=document.getElementById("email").value.trim();

    const password=passwordInput.value.trim();

    if(email===""){

        alert("Please enter your email.");

        return;

    }

    if(password===""){

        alert("Please enter your password.");

        return;

    }

    // Replace with API call

    window.location.href="../dashboard/index.html";

});</script>

<script>
    lucide.createIcons();
</script>

</body>

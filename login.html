<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | SchoolBooks</title>

    

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet"
        href="login.css">

</head>

<body>

    <main class="login-page">

        <!--==============================
                BACKGROUND
        ===============================-->

        <div class="login-bg-shapes">

            <span class="shape shape-one"></span>

            <span class="shape shape-two"></span>

            <span class="shape shape-three"></span>

            <span class="shape shape-four"></span>

            <img src="../global-images/books-login.png"
                class="floating-item float-one"
                alt="Books">

            <img src="../global-images/note-book.png"
                class="floating-item float-two"
                alt="Notebook">

            <img src="../global-images/pencil.png"
                class="floating-item float-three"
                alt="Pencil">

            <img src="../global-images/scale.png"
                class="floating-item float-four"
                alt="Ruler">

        </div>

        <!--==============================
                TOP CONTROLS
        ===============================-->

        <div class="login-top-actions">

            <button
                id="rtlBtn"
                class="action-btn">

                RTL

            </button>

            <button
                id="themeBtn"
                class="action-btn">

                <i data-lucide="moon"></i>

            </button>

        </div>

        <!--==============================
                LOGIN CARD
        ===============================-->

        <section class="login-card">

            <!--==========================
                    LOGO
            ==========================-->

            <div class="login-page-logo">

                <a href="../index.html">

                    <img src="../global-images/logo.png"
                        alt="School Stationery & Book Shop Logo">

                    School<span>Books</span>

                </a>

            </div>

            <!--==========================
                    HEADING
            ==========================-->

            <div class="login-header">

                <h2>

                    Welcome Back

                </h2>

                <p>

                    Sign in to continue shopping books,
                    stationery and learning essentials.

                </p>

            </div>

            <!--==========================
                    FORM
            ==========================-->

            <form class="login-form">

                

                <div class="form-group">

                    <label>

                        Email Address

                    </label>

                    <div class="input-box">

                        <i data-lucide="mail"></i>

                        <input
                            type="email"
                            placeholder="Enter your email">

                    </div>

                </div>

                

                <div class="form-group">

                    <label>

                        Password

                    </label>

                    <div class="input-box">

                        <i data-lucide="lock"></i>

                        <input
                            id="password"
                            type="password"
                            placeholder="Enter your password">

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle">

                            <i data-lucide="eye"></i>

                        </button>

                    </div>

                </div>

                

                <div class="login-options">

                    <label class="remember-me">

                        <input type="checkbox">

                        <span>

                            Remember Me

                        </span>

                    </label>

                    <a href="#">

                        Forgot Password?

                    </a>

                </div>

                

                <button
                    class="login-btn"
                    type="submit">

                    Login

                </button>
                                <!--====================================
                        SOCIAL DIVIDER
                =====================================-->

                <div class="social-divider">

                    <span>

                        Or Continue With

                    </span>

                </div>


                <!--====================================
                        SOCIAL LOGIN
                =====================================-->

                <div class="social-login">

                    

                    <a href="#"
                        class="social-btn google-btn">

                        <i class="fa-brands fa-google"></i>

                        <span>

                            Google

                        </span>

                    </a>


                    

                    <a href="#"
                        class="social-btn apple-btn">

                        <i class="fa-brands fa-apple"></i>

                        <span>

                            Apple

                        </span>

                    </a>


                    

                    <a href="#"
                        class="social-btn facebook-btn">

                        <i class="fa-brands fa-facebook-f"></i>

                        <span>

                            Facebook

                        </span>

                    </a>

                </div>

            </form>


            <!--====================================
                    SIGNUP
            =====================================-->

            <div class="signup-area">

                <p>

                    Don't have an account?

                    <a href="signup.html">

                        Create Account

                    </a>

                </p>

            </div>

        </section>

    </main>

    <!--====================================
            LUCIDE ICONS
    =====================================-->

    <script>

        lucide.createIcons();

    </script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!--====================================
            LOGIN JS
    =====================================-->

    <script>/*=========================================
            LUCIDE ICONS
=========================================*/

lucide.createIcons();



/*=========================================
            DARK MODE
=========================================*/

const themeBtn = document.getElementById("themeBtn");

themeBtn.addEventListener("click", () => {

    document.body.classList.toggle("dark");

    const icon = themeBtn.querySelector("i");

    if(document.body.classList.contains("dark")){

        icon.setAttribute("data-lucide","sun");

    }

    else{

        icon.setAttribute("data-lucide","moon");

    }

    lucide.createIcons();

});



/*=========================================
                RTL MODE
=========================================*/

const rtlBtn = document.getElementById("rtlBtn");

rtlBtn.addEventListener("click",()=>{

    const html=document.documentElement;

    html.dir=html.dir==="rtl" ? "ltr" : "rtl";

});



/*=========================================
        PASSWORD VISIBILITY
=========================================*/

const password=document.getElementById("password");

const togglePassword=document.getElementById("togglePassword");

togglePassword.addEventListener("click",()=>{

    if(password.type==="password"){

        password.type="text";

        togglePassword.innerHTML='<i data-lucide="eye-off"></i>';

    }

    else{

        password.type="password";

        togglePassword.innerHTML='<i data-lucide="eye"></i>';

    }

    lucide.createIcons();

});



/*=========================================
            FORM SUBMIT
=========================================*/

const loginForm=document.querySelector(".login-form");

loginForm.addEventListener("submit",(e)=>{

    e.preventDefault();

    alert("Login Successfully!");

});</script>

</body>

</html>

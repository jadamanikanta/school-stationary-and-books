<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found</title>



<script src="https://cdn.tailwindcss.com"></script>



<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">



<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}

:root{

--primary:#2563EB;
--secondary:#FBBF24;

--bg:#f8fafc;
--card:#ffffff;

--text:#111827;
--text-light:#6b7280;

--border:#dbe4f0;

}

body.dark{

--bg:#0f172a;
--card:#1e293b;

--text:#ffffff;
--text-light:#cbd5e1;

--border:#334155;

}

html,
body{

width:100%;
height:100%;

overflow:hidden;

font-family:'Poppins',sans-serif;

background:var(--bg);

color:var(--text);

transition:.35s;

}

/*=========================================
            PAGE
=========================================*/

.error-page{

position:relative;

width:100%;
height:100vh;

display:flex;

justify-content:center;
align-items:center;

padding:20px;

overflow:hidden;

}

/*=========================================
        FLOATING BACKGROUND
=========================================*/

.background{

position:absolute;

inset:0;

overflow:hidden;

pointer-events:none;

}

.blob{

position:absolute;

border-radius:50%;

filter:blur(2px);

}

.blob.one{

width:350px;
height:350px;

top:-120px;
left:-120px;

background:rgba(37,99,235,.12);

animation:floatOne 9s infinite ease-in-out;

}

.blob.two{

width:260px;
height:260px;

top:100px;
right:-70px;

background:rgba(251,191,36,.20);

animation:floatTwo 8s infinite ease-in-out;

}

.blob.three{

width:220px;
height:220px;

bottom:-70px;
left:120px;

background:rgba(37,99,235,.08);

animation:floatThree 10s infinite ease-in-out;

}

.blob.four{

width:280px;
height:280px;

right:140px;
bottom:-100px;

background:rgba(251,191,36,.12);

animation:floatTwo 11s infinite ease-in-out;

}

/*=========================================
        FLOATING ICONS
=========================================*/

.float-item{

position:absolute;

opacity:.9;

}

.float-one{

top:120px;
left:120px;

animation:bookFloat1 8s infinite ease-in-out;

}

.float-two{

top:200px;
right:180px;

animation:bookFloat2 9s infinite ease-in-out;

}

.float-three{

left:180px;
bottom:120px;

animation:bookFloat3 8s infinite ease-in-out;

}

.float-four{

bottom:120px;
right:220px;

animation:bookFloat2 10s infinite ease-in-out;

}

.float-item svg{

width:60px;
height:60px;

color:var(--primary);

opacity:.18;

}

/*=========================================
        TOP BUTTONS
=========================================*/

.top-actions{

position:absolute;

top:25px;
right:25px;

display:flex;

gap:12px;

z-index:100;

}

.action-btn{

width:46px;
height:46px;

border:none;

border-radius:50%;

background:var(--card);

color:var(--text-color);

cursor:pointer;

display:flex;

justify-content:center;
align-items:center;

box-shadow:0 10px 25px rgba(0,0,0,.08);

transition:.35s;

border:1px solid var(--primary);

}

.action-btn:hover{

background:var(--primary);

color:#fff;

transform:translateY(-4px);

}

/*=========================================
        CARD
=========================================*/

.error-card{

position:relative;

width:100%;
max-width:620px;

padding:55px 45px;

background:rgba(255,255,255,.92);

backdrop-filter:blur(20px);

border:2px solid var(--primary);

border-radius:30px;

box-shadow:0 25px 60px rgba(37,99,235,.15);

text-align:center;

z-index:20;

}

body.dark .error-card{

background:rgba(30,41,59,.92);

}

.error-icon{

width:100px;
height:100px;

margin:auto;

border-radius:50%;

background:rgba(37,99,235,.12);

display:flex;

justify-content:center;
align-items:center;

margin-bottom:25px;

}

.error-icon svg{

width:48px;
height:48px;

color:var(--primary);

}

.error-code{

font-size:120px;

font-weight:800;

line-height:1;

color:var(--primary);

margin-bottom:10px;

}

.error-title{

font-size:36px;

font-weight:700;

margin-bottom:15px;

}

.error-text{

font-size:17px;

line-height:1.8;

color:var(--text-light);

margin-bottom:35px;

}

/*=========================================
        ANIMATIONS
=========================================*/

@keyframes floatOne{

50%{

transform:translateY(35px);

}

}

@keyframes floatTwo{

50%{

transform:translateX(-25px);

}

}

@keyframes floatThree{

50%{

transform:translateY(-30px);

}

}

@keyframes bookFloat1{

50%{

transform:translateY(-20px) rotate(10deg);

}

}

@keyframes bookFloat2{

50%{

transform:translateY(18px);

}

}

@keyframes bookFloat3{

50%{

transform:translateX(18px);

}

}
/*=========================================================
                BUTTONS
=========================================================*/

.error-actions{

display:flex;

justify-content:center;

align-items:center;

gap:18px;

flex-wrap:wrap;

}

.home-btn{

display:inline-flex;

align-items:center;

justify-content:center;

gap:10px;

padding:14px 30px;

border-radius:16px;

background:var(--primary);

color:#fff;

font-size:16px;

font-weight:600;

text-decoration:none;

transition:.35s;

}

.home-btn:hover{

background:var(--secondary);

color:#111827;

transform:translateY(-4px);

}

.back-btn{

display:inline-flex;

align-items:center;

justify-content:center;

gap:10px;

padding:14px 30px;

border:2px solid var(--primary);

border-radius:16px;

background:transparent;

color:var(--primary);

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.35s;

}

.back-btn:hover{

background:var(--primary);

color:#fff;

transform:translateY(-4px);

}

/*=========================================================
                    RTL
=========================================================*/

html[dir="rtl"] .top-actions{

right:auto;

left:25px;

}

html[dir="rtl"] .error-actions{

flex-direction:row-reverse;

}

/*=========================================================
                RESPONSIVE
=========================================================*/

@media(max-width:1024px){

.error-card{

max-width:560px;

padding:45px 35px;

}

.error-code{

font-size:100px;

}

.error-title{

font-size:32px;

}

}

@media(max-width:768px){

html,
body{

overflow:auto;

}

.error-page{

height:auto;

min-height:100vh;

padding:70px 20px 30px;

}

.error-card{

padding:35px 25px;

border-radius:24px;

}

.error-code{

font-size:84px;

}

.error-title{

font-size:28px;

}

.error-text{

font-size:15px;

}

.error-actions{

flex-direction:column;

}

.home-btn,
.back-btn{

width:100%;

}

.float-item{

display:none;

}

.top-actions{

top:18px;

right:18px;

}

.action-btn{

width:42px;

height:42px;

}

}

@media(max-width:360px){

.error-page{

padding:60px 12px 20px;

}

.error-card{

padding:28px 18px;

border-radius:20px;

}

.error-icon{

width:80px;

height:80px;

}

.error-icon svg{

width:40px;

height:40px;

}

.error-code{

font-size:64px;

}

.error-title{

font-size:22px;

}

.error-text{

font-size:14px;

line-height:1.7;

}

.home-btn,
.back-btn{

padding:12px;

font-size:14px;

}

.action-btn{

width:36px;

height:36px;

}

}

</style>

</head>

<body>

<div class="error-page">



<div class="top-actions">

<button class="action-btn" id="rtlToggle">

RTL

</button>

<button class="action-btn" id="themeToggle">

<i data-lucide="moon"></i>

</button>

</div>

<div class="error-card">

<div class="error-icon">

<i data-lucide="triangle-alert"></i>

</div>

<h1 class="error-code">

404

</h1>

<h2 class="error-title">

Oops! Page Not Found

</h2>

<p class="error-text">

The page you're trying to visit doesn't exist or has been moved.
Please check the URL or return to the homepage.

</p>

<div class="error-actions">

<a href="index.html" class="home-btn">

<i data-lucide="house"></i>

Home

</a>

<a href="index.html" class="home-btn">

<i data-lucide="house"></i>

Go Back

</a>

</div>

</div>

</div>

<script>
    

lucide.createIcons();



const themeToggle = document.getElementById("themeToggle");

if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}

if (themeToggle) {

    themeToggle.innerHTML = document.body.classList.contains("dark")
        ? '<i data-lucide="sun"></i>'
        : '<i data-lucide="moon"></i>';

    lucide.createIcons();

    themeToggle.addEventListener("click", () => {

        document.body.classList.toggle("dark");

        if (document.body.classList.contains("dark")) {
            localStorage.setItem("theme", "dark");
            themeToggle.innerHTML = '<i data-lucide="sun"></i>';
        } else {
            localStorage.setItem("theme", "light");
            themeToggle.innerHTML = '<i data-lucide="moon"></i>';
        }

        lucide.createIcons();

    });
}
const rtlToggle = document.getElementById("rtlToggle");

const savedDir = localStorage.getItem("direction") || "ltr";
document.documentElement.setAttribute("dir", savedDir);

if (rtlToggle) {

    rtlToggle.textContent = savedDir === "rtl" ? "LTR" : "RTL";

    rtlToggle.addEventListener("click", () => {

        const currentDir = document.documentElement.getAttribute("dir");

        if (currentDir === "rtl") {
            document.documentElement.setAttribute("dir", "ltr");
            localStorage.setItem("direction", "ltr");
            rtlToggle.textContent = "RTL";
        } else {
            document.documentElement.setAttribute("dir", "rtl");
            localStorage.setItem("direction", "rtl");
            rtlToggle.textContent = "LTR";
        }

    });

}




//=========================================================
//                  GO BACK
//=========================================================

const backBtn = document.getElementById("backBtn");

backBtn.addEventListener("click",()=>{

    history.back();

});



//=========================================================
//      OPTIONAL FLOATING ANIMATION RESTART
//=========================================================

window.addEventListener("load",()=>{

    document.querySelectorAll(".blob").forEach(blob=>{

        blob.style.animationPlayState="running";

    });

});

</script>

</body>
</html>

<script>

lucide.createIcons();



const slides = document.querySelectorAll(".hero-slide");
const dots = document.querySelectorAll(".hero-dot");

let currentSlide = 0;

function showSlide(index){

    slides.forEach(slide => slide.classList.remove("active"));
    dots.forEach(dot => dot.classList.remove("active"));

    slides[index].classList.add("active");
    dots[index].classList.add("active");

}

function nextSlide(){

    currentSlide++;

    if(currentSlide >= slides.length){

        currentSlide = 0;

    }

    showSlide(currentSlide);

}

setInterval(nextSlide,5000);

dots.forEach((dot,index)=>{

    dot.addEventListener("click",()=>{

        currentSlide=index;

        showSlide(index);

    });

});


// Password
const password = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

if (togglePassword && password) {
    togglePassword.addEventListener("click", () => {

        const isHidden = password.type === "password";

        password.type = isHidden ? "text" : "password";

        togglePassword.innerHTML = isHidden
            ? '<i data-lucide="eye-off"></i>'
            : '<i data-lucide="eye"></i>';

        lucide.createIcons();
    });
}


// Confirm Password
const confirmPassword = document.getElementById("confirmPassword");
const toggleConfirmPassword =
    document.getElementById("toggleConfirmPassword");

if (toggleConfirmPassword && confirmPassword) {
    toggleConfirmPassword.addEventListener("click", () => {

        const isHidden = confirmPassword.type === "password";

        confirmPassword.type = isHidden ? "text" : "password";

        toggleConfirmPassword.innerHTML = isHidden
            ? '<i data-lucide="eye-off"></i>'
            : '<i data-lucide="eye"></i>';

        lucide.createIcons();
    });
}



lucide.createIcons();

const themeBtn = document.getElementById("themeToggle");

const savedTheme = localStorage.getItem("school-theme") || "light";

if (savedTheme === "dark") {
    document.body.classList.add("dark");
}

if (themeBtn) {

    updateThemeIcon();

    themeBtn.addEventListener("click", () => {

        document.body.classList.toggle("dark");

        localStorage.setItem(
            "school-theme",
            document.body.classList.contains("dark") ? "dark" : "light"
        );

        updateThemeIcon();

    });

}

function updateThemeIcon() {

    if (!themeBtn) return;

    themeBtn.innerHTML = document.body.classList.contains("dark")
        ? '<i data-lucide="sun"></i>'
        : '<i data-lucide="moon"></i>';

    lucide.createIcons();

}




const rtlBtn = document.getElementById("rtlToggle");

const html = document.documentElement;

const savedDir = localStorage.getItem("direction") || "ltr";

html.setAttribute("dir", savedDir);

if (rtlBtn) {

    rtlBtn.textContent = savedDir === "rtl" ? "LTR" : "RTL";

    rtlBtn.addEventListener("click", () => {

        if (html.getAttribute("dir") === "rtl") {

            html.setAttribute("dir", "ltr");
            localStorage.setItem("direction", "ltr");
            rtlBtn.textContent = "RTL";

        } else {

            html.setAttribute("dir", "rtl");
            localStorage.setItem("direction", "rtl");
            rtlBtn.textContent = "LTR";

        }

    });

}



const loginForm=document.getElementById("loginForm");

loginForm.addEventListener("submit",(e)=>{

    e.preventDefault();

    const email=document.getElementById("email").value.trim();

    const password=passwordInput.value.trim();

        return;

    }

    if(password===""){

        alert("Please enter your password.");

        return;

    }

   

    window.location.href="index.html";

});</script>

<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | SchoolBooks</title>

    

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="signup.css">

</head>

<body>

<main class="login-page">

    <!--==============================
            BACKGROUND SHAPES
    ===============================-->

    <div class="login-bg-shapes">

        <span class="shape shape-one"></span>
        <span class="shape shape-two"></span>
        <span class="shape shape-three"></span>
        <span class="shape shape-four"></span>

        <img src="../global-images/books-login.png"
             class="floating-item float-one"
             alt="Books">

        <img src="../global-images/note-book.png"
             class="floating-item float-two"
             alt="Notebook">

        <img src="../global-images/pencil.png"
             class="floating-item float-three"
             alt="Pencil">

        <img src="../global-images/scale.png"
             class="floating-item float-four"
             alt="Ruler">

    </div>

    <!--==============================
            RTL / DARK MODE
    ===============================-->

    <div class="login-top-actions">

        <button id="rtlBtn"
                class="action-btn">

            RTL

        </button>

        <button id="themeBtn"
                class="action-btn">

            <i data-lucide="moon"></i>

        </button>

    </div>

    <!--==============================
            SIGNUP CARD
    ===============================-->

    <section class="login-card">

        

        <div class="login-page-logo">

            <a href="../index.html">

                <img src="../global-images/logo.png"
                     alt="SchoolBooks">

                School<span>Books</span>

            </a>

        </div>

        

        <div class="login-header">

            <h2>Create Account</h2>

            <p>

                Join thousands of students and educators today.

            </p>

        </div>

        <!--==========================
                FORM
        ==========================-->

        <form class="signup-form">

            

            <div class="form-group">

                <label>Full Name</label>

                <div class="input-box">

                    <i data-lucide="user-round"></i>

                    <input type="text"
                           placeholder="Enter your full name">

                </div>

            </div>

            

            <div class="form-group">

                <label>Email Address</label>

                <div class="input-box">

                    <i data-lucide="mail"></i>

                    <input type="email"
                           placeholder="Enter your email">

                </div>

            </div>

            

            <div class="form-group">

                <label>Mobile Number</label>

                <div class="input-box">

                    <i data-lucide="phone"></i>

                    <input type="tel"
                           placeholder="Enter your mobile number">

                </div>

            </div>

            

            <div class="form-group">

                <label>Password</label>

                <div class="input-box">

                    <i data-lucide="lock"></i>

                    <input id="password"
                           type="password"
                           placeholder="Create password">

                    <button type="button"
                            class="password-toggle"
                            id="togglePassword">

                        <i data-lucide="eye"></i>

                    </button>

                </div>

            </div>

            

            <div class="form-group">

                <label>Confirm Password</label>

                <div class="input-box">

                    <i data-lucide="shield-check"></i>

                    <input id="confirmPassword"
                           type="password"
                           placeholder="Confirm password">

                    <button type="button"
                            class="password-toggle"
                            id="toggleConfirmPassword">

                        <i data-lucide="eye"></i>

                    </button>

                </div>

            </div>

            

            <div class="remember-me">

                <input type="checkbox"
                       id="terms">

                <label for="terms">

                    I agree to the

                    <a href="#">Terms</a>

                    &

                    <a href="#">Privacy Policy</a>

                </label>

            </div>

            

            <button class="login-btn"
                    type="submit">

                Create Account

            </button>

        </form>

        

        <div class="social-divider">

            <span>Or Continue With</span>

        </div>

        

        <div class="social-login">

            <a href="#"
               class="social-btn google-btn">

                <i class="fa-brands fa-google"></i>

                <span>Google</span>

            </a>

            <a href="#"
               class="social-btn apple-btn">

                <i class="fa-brands fa-apple"></i>

                <span>Apple</span>

            </a>

            <a href="#"
               class="social-btn facebook-btn">

                <i class="fa-brands fa-facebook-f"></i>

                <span>Facebook</span>

            </a>

        </div>

        

        <div class="signup-area">

            <p>

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>

        </div>

    </section>

</main>

<script>

    lucide.createIcons();

</script>

<script>

    /*=========================================================
                    LUCIDE ICONS
=========================================================*/

lucide.createIcons();



/*=========================================================
                    DARK MODE
=========================================================*/

const themeBtn = document.getElementById("themeBtn");

themeBtn.addEventListener("click", () => {

    document.body.classList.toggle("dark");

    const icon = themeBtn.querySelector("i");

    if(document.body.classList.contains("dark")){

        icon.setAttribute("data-lucide","sun");

    }

    else{

        icon.setAttribute("data-lucide","moon");

    }

    lucide.createIcons();

});



/*=========================================================
                    RTL MODE
=========================================================*/

const rtlBtn = document.getElementById("rtlBtn");

rtlBtn.addEventListener("click", () => {

    const html = document.documentElement;

    html.dir = html.dir === "rtl" ? "ltr" : "rtl";

});



/*=========================================================
                PASSWORD VISIBILITY
=========================================================*/

const password = document.getElementById("password");

const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", () => {

    if(password.type === "password"){

        password.type = "text";

        togglePassword.innerHTML =
        '<i data-lucide="eye-off"></i>';

    }

    else{

        password.type = "password";

        togglePassword.innerHTML =
        '<i data-lucide="eye"></i>';

    }

    lucide.createIcons();

});



/*=========================================================
            CONFIRM PASSWORD VISIBILITY
=========================================================*/

const confirmPassword =
document.getElementById("confirmPassword");

const toggleConfirmPassword =
document.getElementById("toggleConfirmPassword");

toggleConfirmPassword.addEventListener("click", () => {

    if(confirmPassword.type === "password"){

        confirmPassword.type = "text";

        toggleConfirmPassword.innerHTML =
        '<i data-lucide="eye-off"></i>';

    }

    else{

        confirmPassword.type = "password";

        toggleConfirmPassword.innerHTML =
        '<i data-lucide="eye"></i>';

    }

    lucide.createIcons();

});



/*=========================================================
                SIGNUP FORM VALIDATION
=========================================================*/

const signupForm =
document.querySelector(".signup-form");

signupForm.addEventListener("submit",(e)=>{

    e.preventDefault();

    const name =
    signupForm.querySelector('input[type="text"]').value.trim();

    const email =
    signupForm.querySelector('input[type="email"]').value.trim();

    const phone =
    signupForm.querySelector('input[type="tel"]').value.trim();

    const pass =
    password.value.trim();

    const confirm =
    confirmPassword.value.trim();

    const terms =
    document.getElementById("terms");



    if(name===""){

        alert("Please enter your full name.");

        return;

    }



    if(email===""){

        alert("Please enter your email address.");

        return;

    }



    if(phone===""){

        alert("Please enter your mobile number.");

        return;

    }



    if(pass.length < 6){

        alert("Password must be at least 6 characters.");

        return;

    }



    if(pass !== confirm){

        alert("Passwords do not match.");

        return;

    }



    if(!terms.checked){

        alert("Please accept the Terms & Privacy Policy.");

        return;

    }



    alert("Account Created Successfully!");

    signupForm.reset();

});
</script>

</body>

</html>
